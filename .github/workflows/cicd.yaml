
name: Streamlit AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. CONTINUOUS INTEGRATION
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  # 2. BUILD AND PUSH TO DOCKER HUB
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image settings
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$IMAGE_NAME" ]; then
            echo "::error::IMAGE_NAME secret is missing."
            exit 1
          fi

          if [ "$IMAGE_NAME" != "agentic-chatbot-using-langgraph" ]; then
            echo "::error::IMAGE_NAME does not match the expected repository."
            exit 1
          fi

          echo "Docker image settings are valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: aakash122
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            aakash122/agentic-chatbot-using-langgraph:main
            aakash122/agentic-chatbot-using-langgraph:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. DEPLOY TO AWS EC2
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: aakash122
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate application secrets
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          set -eu

          for key in \
            GOOGLE_API_KEY \
            TAVILY_API_KEY \
            OPENWEATHER_API_KEY \
            LANGSMITH_TRACING \
            LANGSMITH_ENDPOINT \
            LANGSMITH_API_KEY \
            LANGSMITH_PROJECT
          do
            eval 'value="${'"$key"'-}"'
            if [ -z "$value" ]; then
              echo "::error::$key secret is missing."
              exit 1
            fi
          done

          echo "All required application secrets are configured."

      - name: Pull latest Docker image
        run: |
          docker pull aakash122/agentic-chatbot-using-langgraph:main

      - name: Stop existing container
        run: |
          docker rm -f stapp 2>/dev/null || true

      - name: Run Streamlit container
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          docker run -d \
            --restart unless-stopped \
            --name stapp \
            -p 8501:8501 \
            -e OPENAI_API_KEY \
            -e GOOGLE_API_KEY \
            -e TAVILY_API_KEY \
            -e OPENWEATHER_API_KEY \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            aakash122/agentic-chatbot-using-langgraph:main

      - name: Verify container is running
        run: |
          sleep 10

          if ! docker ps \
            --filter "name=^stapp$" \
            --filter "status=running" \
            --format "{{.Names}}" | grep -q "^stapp$"; then
            echo "The Streamlit container failed to start."
            docker logs stapp || true
            exit 1
          fi

          echo "The Streamlit container is running."
          docker ps --filter "name=^stapp$"

      - name: Verify Streamlit health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if docker exec stapp python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)" \
              >/dev/null 2>&1; then
              echo "Streamlit application is healthy."
              exit 0
            fi

            echo "Waiting for Streamlit to become ready..."
            sleep 5
          done

          echo "Streamlit did not become healthy."
          docker logs --tail 100 stapp || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 stapp 2>/dev/null || true

      - name: Remove unused Docker images
        if: always()
        run: docker image prune -f
